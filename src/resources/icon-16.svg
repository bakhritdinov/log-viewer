<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- icon.svg fitted to the 16 px grid: three rows on whole pixels, so the
       stripes stay crisp in title bars and file lists. -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="#161b22" stroke="#30363d"/>
  <rect x="3" y="3" width="2" height="2" fill="#f85149"/>
  <rect x="6" y="3" width="7" height="2" fill="#f0f6fc"/>
  <rect x="3" y="7" width="2" height="2" fill="#d29922"/>
  <rect x="6" y="7" width="5" height="2" fill="#8b949e"/>
  <rect x="3" y="11" width="2" height="2" fill="#58a6ff"/>
  <rect x="6" y="11" width="6" height="2" fill="#8b949e"/>
</svg>
