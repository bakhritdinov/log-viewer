name: Tests

on:
  push:
    branches: [master, rewrite]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: '6.8.2'

jobs:
  unit:
    name: Tests (${{ matrix.os }}, ${{ matrix.ui }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, ui: desktop }
          - { os: macos-14, ui: desktop }
          - { os: windows-latest, ui: desktop }
          # The phone design, built and tested on the desktop (offscreen).
          - { os: ubuntu-24.04, ui: mobile }
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libsecret-1-dev libgl1-mesa-dev libegl1-mesa-dev \
          libxkbcommon-dev libfontconfig1-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        cache: true

    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLOGVIEWER_TESTS=ON -DLOGVIEWER_UI=${{ matrix.ui }} -Wno-dev

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  web:
    name: WebAssembly (PWA)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    # The WebAssembly Qt needs a desktop Qt of the same version for its tools.
    - name: Install Qt (host)
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        cache-key-prefix: qt-host

    - name: Remember the host Qt
      run: echo "QT_HOST_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

    - name: Install Qt (WebAssembly)
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'wasm'
        arch: 'wasm_singlethread'
        cache: true
        cache-key-prefix: qt-wasm

    # Qt 6.8 is built with Emscripten 3.1.56.
    - name: Install Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '3.1.56'

    - name: Build
      run: |
        "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DQT_HOST_PATH="$QT_HOST_DIR" -Wno-dev
        cmake --build build-wasm --target LogViewer

    - name: Collect the PWA
      run: |
        out=build-wasm/src/platform
        mkdir -p dist/pwa
        cp -r "$out"/index.html "$out"/manifest.webmanifest "$out"/sw.js "$out"/qtloader.js \
              "$out"/LogViewer.js "$out"/LogViewer.wasm "$out"/icons dist/pwa/
        (cd dist/pwa && zip -r ../LogViewer-PWA.zip .)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LogViewer-PWA
        path: dist/LogViewer-PWA.zip

  golden:
    name: Characterization fixtures are generated, not edited
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository (full history for git show)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Regenerate and compare
      run: |
        node tools/characterize/gen-golden.mjs 1e4c728
        git diff --exit-code -- tests/fixtures/characterization
