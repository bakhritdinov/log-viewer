name: Build and Release LogViewer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install NSIS
      run: choco install nsis

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'

    - name: Build and Package
      shell: pwsh
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
        
        # Create Portable version (CMake now handles windeployqt via install script)
        mkdir dist/portable
        cmake --install build --prefix dist/portable --component app
        
        # CPack will create both EXE (NSIS) and ZIP
        cpack --config build/CPackConfig.cmake -B dist/ -C Release
        
        # Organize artifacts
        if (Test-Path "dist/LogViewer-Windows-x64.zip") {
            Move-Item dist/LogViewer-Windows-x64.zip dist/LogViewer-Windows-Portable.zip -Force
        } else {
            # If CPack didn't create the zip in the expected name, zip the portable dir
            Compress-Archive -Path dist/portable/* -DestinationPath dist/LogViewer-Windows-Portable.zip -Force
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LogViewer-Windows-x64
        path: |
          dist/LogViewer-Windows-x64.exe
          dist/LogViewer-Windows-Portable.zip

  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: brew install ninja brotli zstd

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'

    - name: Build and Package
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
        cmake --build build --config Release -j "$(sysctl -n hw.logicalcpu)"
        # Install to trigger deployment and signing
        mkdir -p dist/bundle
        DESTDIR=$PWD/dist/bundle cmake --install build --prefix / --component app
        # Final sign for safety
        codesign --force --deep --sign - dist/bundle/LogViewer.app
        # Package
        cpack --config build/CPackConfig.cmake -B dist/ -C Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LogViewer-macOS-Universal
        path: dist/LogViewer-macOS-Universal.dmg

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04          # the oldest glibc the AppImage still runs on
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        # libsecret: passwords in the Secret Service (QtKeychain)
        sudo apt-get install -y ninja-build libsecret-1-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libegl1-mesa-dev \
          libdbus-1-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-0 libxcb-cursor0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
          libxcb-xinerama0 libxcb-xkb1 libfuse2

    # The AppImage carries this Qt with it: users need nothing else.
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'

    - name: Build and Package AppImage
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -Wno-dev
        cmake --build build -j $(nproc)
        cmake --build build --target appimage

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LogViewer-Linux
        path: dist/LogViewer-Linux.AppImage

  build-web:
    name: Build WebAssembly (PWA)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Install Qt (host)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache-key-prefix: qt-host

    - name: Remember the host Qt
      run: echo "QT_HOST_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

    - name: Install Qt (WebAssembly)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'
        host: 'all_os'
        target: 'wasm'
        arch: 'wasm_singlethread'
        cache-key-prefix: qt-wasm

    - name: Install Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '3.1.56'

    - name: Build and Package
      run: |
        "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release           -DQT_HOST_PATH="$QT_HOST_DIR" -Wno-dev
        cmake --build build-wasm --target LogViewer
        out=build-wasm/src/platform
        mkdir -p dist/pwa
        cp -r "$out"/index.html "$out"/manifest.webmanifest "$out"/sw.js "$out"/qtloader.js               "$out"/LogViewer.js "$out"/LogViewer.wasm "$out"/icons dist/pwa/
        (cd dist/pwa && zip -r ../LogViewer-PWA.zip .)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LogViewer-PWA
        path: dist/LogViewer-PWA.zip

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/LogViewer-Windows-x64.exe
          artifacts/LogViewer-Windows-Portable.zip
          artifacts/LogViewer-macOS-Universal.dmg
          artifacts/LogViewer-Linux.AppImage
          artifacts/LogViewer-PWA.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The PWA at https://bakhritdinov.github.io/log-viewer/ (Settings → Pages →
  # Source: GitHub Actions). Phones open it and install it from the browser;
  # each Grafana must allow this origin (docs/PWA.md).
  publish-pwa:
    name: Publish the PWA to GitHub Pages
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - name: Download the PWA
      uses: actions/download-artifact@v4
      with:
        name: LogViewer-PWA
        path: .

    - name: Unpack
      run: |
        mkdir site
        unzip -q LogViewer-PWA.zip -d site
        touch site/.nojekyll

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Deploy
      id: deploy
      uses: actions/deploy-pages@v4

  publish-chocolatey:
    name: Publish to Chocolatey
    needs: [release]
    runs-on: windows-latest
    # Chocolatey moderation can hold a release for days; don't block the rest of the pipeline.
    continue-on-error: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: LogViewer-Windows-x64
        path: artifacts

    - name: Lint Chocolatey scripts (ASCII-only)
      shell: pwsh
      run: |
        # Windows PowerShell 5.1 reads .ps1 without BOM as Windows-1252, so any
        # non-ASCII byte (em-dash, smart quotes, NBSP) is reinterpreted and can
        # turn into a stray quote that breaks the parser. Fail the build early.
        $files = Get-ChildItem -Path 'deploy/chocolatey' -Recurse -Include *.ps1,*.nuspec
        $bad = $files | Select-String -Pattern '[^\x00-\x7F]'
        if ($bad) {
          $bad | ForEach-Object {
            Write-Host ("::error file={0},line={1}::Non-ASCII byte at column {2}" -f $_.Path, $_.LineNumber, ($_.Matches[0].Index + 1))
            Write-Host "    $($_.Line)"
          }
          throw "Non-ASCII characters found in Chocolatey scripts. PowerShell 5.1 will misparse them on Windows."
        }
        Write-Host "OK: all Chocolatey scripts are ASCII-only ($($files.Count) files checked)."

    - name: Prepare Package
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $checksum = (Get-FileHash artifacts/LogViewer-Windows-x64.exe -Algorithm SHA256).Hash
        
        $nuspecPath = "deploy/chocolatey/log-viewer.nuspec"
        $nuspec = Get-Content $nuspecPath -Raw
        $nuspec = $nuspec.Replace("[[VERSION]]", $version)
        Set-Content $nuspecPath $nuspec
        
        $scriptPath = "deploy/chocolatey/tools/chocolateyInstall.ps1"
        $script = Get-Content $scriptPath -Raw
        $script = $script.Replace("[[VERSION]]", $version).Replace("[[CHECKSUM64]]", $checksum)
        Set-Content $scriptPath $script
        
        New-Item -ItemType Directory -Force -Path dist
        choco pack $nuspecPath --outputdirectory dist
        Get-ChildItem dist/

    - name: Push to Chocolatey
      shell: pwsh
      run: |
        $package = Get-ChildItem dist/*.nupkg | Select-Object -First 1
        if ($package) {
            choco push $package.FullName --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCO_API_KEY }}
        } else {
            Write-Error "No nupkg file found in dist/"
            exit 1
        }
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

  publish-homebrew:
    name: Publish to Homebrew Tap
    needs: [release]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download DMG
      uses: actions/download-artifact@v4
      with:
        name: LogViewer-macOS-Universal
        path: .

    - name: Update Cask
      run: |
        VERSION=$(echo "${{ github.ref_name }}" | sed 's/v//')
        SHA256=$(sha256sum LogViewer-macOS-Universal.dmg | awk '{print $1}')
        
        sed -e "s/\[\[VERSION\]\]/$VERSION/g" \
            -e "s/\[\[SHA256\]\]/$SHA256/g" \
            deploy/homebrew/log-viewer.rb.template > log-viewer.rb
            
    - name: Push to Tap
      uses: dmnemec/copy_file_to_another_repo_action@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.TAP_GITHUB_TOKEN }}
      with:
        source_file: 'log-viewer.rb'
        destination_repo: '${{ github.repository_owner }}/homebrew-tap'
        destination_folder: 'Casks'
        user_email: 'action@github.com'
        user_name: 'GitHub Action'
        commit_message: 'Update LogViewer Cask to ${{ github.ref_name }}'
